<html>
    <head>
        <title>: Javascript :</title>
        <script>
           alert("Hello welcome to my page.");
         let i = confirm("Do you want to continue?");
         if(i == true){
            alert("You selected true or OK");
         } else{
            alert("You choose False or CANCEL");
         }
         let userName = prompt("What is your name?");
         if(userName == null){
            alert("You Canceled it");
         } else if(userName.trim() === ""){
            alert("You entered an empty name");
         } else{
            alert("Hello, " + userName + "!");
         }
        </script>
    </head>
</html>
