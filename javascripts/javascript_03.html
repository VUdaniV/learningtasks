<!DOCTYPE html>
<html>
    <title>JavaScript 03</title>
    <style>
        #sum{
            color: red;
        }
    </style>
    <script>
        function ClickMe() {
            alert("You clicked the button!");
            let firstnumber = prompt("Enter the first number:");
            let secondnumber = prompt("Enter the second number:");
            let sum = parseFloat(firstnumber) + parseFloat(secondnumber);

            document.getElementById("result").innerHTML = "The sum of " + firstnumber + " and " + secondnumber + " is: " + sum;
        }
    </script>
    <body>
        <button onclick="ClickMe()">Click me to add 2 numbers</button>
        <div id="result">Waiting for the Answer</div>
    </body>
</html>
