<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript 04</title>
        <script>
            function GetName() {
                var name = document.getElementById("myName").value;
                var password = document.getElementById("passPassword").value;
                if (password == "Kramashiudani14") {
                    document.getElementById("name").innerHTML = "My name is " + name;
                } else {
                    document.getElementById("name").innerHTML = "No access. Wrong password.";
                }
            }
        </script>
    </head>
    <body>
        <label for="myName">Name:</label>
        <input type="text" id="myName" name="myName"><br><br>
        <label for="passPassword">Password:</label>
        <input type="password" id="passPassword" name="passPassword"><br><br>
        <button onclick="return GetName()">Click to get my name</button>
        <div id="name"></div>
    </body>
</html>
