<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript 06</title>
        <style type="text/css">
            .image-container {
                display: none;
            }
        </style>
        <script>
            function setinvisible() {
                document.getElementById("First image").style.display = "none";
                document.getElementById("Second Image").style.display = "none";
            }
        </script>
    </head>
    <body>
<div class="image-container" id="First image">
    <img src="https://assets.albiononline.com/uploads/media/default/media/b92faa5821d6cb250e0a32ae0732e2991e8f2089.jpeg" alt="Armored warriors with banners and shields stand on a war-torn hillside under a stormy sky with a distant glowing castle, tense dramatic battle scene" width="500" height="300">
</div>
[<a href=javascript:void(0) onclick="setinvisible()">Click to hide the image</a>]
[<a href=javascript:void(0) onclick="document.getElementById('First image').style.display='block'">Click to show the image</a>]
<div class="image-container" id="Second Image">
    <img src="https://i.ytimg.com/vi/I3_jC3ioWlA/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBqbLYV-0cV977NrwitzumbxQErlQ" alt="Fantasy artwork shows armored characters with bold text WORTH IT and Albion Online, dramatic promotional tone" width="500" height="300">
</div>
[<a href=javascript:void(0) onclick="setinvisible()">Click to hide the image</a>]
[<a href=javascript:void(0) onclick="document.getElementById('Second Image').style.display='block'">Click to show the image</a>]
    </body>
</html>
