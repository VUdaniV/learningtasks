<!DOCTYPE html>
<html>
    <head>
        <Title> Javascript 08 </Title>
        <script>
            function areaofsquare() {
                let side = document.getElementById("side").value;
                let area = side * side;
                document.getElementById("result").innerHTML = "Area of square: " + area;
            }
            function areaoftriangle() {
                let base = document.getElementById("base").value;
                let height = document.getElementById("height").value;
                let area = 0.5 * base * height;
                document.getElementById("triangle-result").innerHTML = "Area of triangle: " + area;
            }
            function areaofcircle() {
                let radius = document.getElementById("radius").value;
                let area = Math.PI * radius * radius;
                document.getElementById("circle-result").innerHTML = "Area of circle: " + area.toFixed(2);
            }
        </script>
    </head>
<body>
    <a name="top"></a>
    <h1> Length Calculator </h1>
    <h2> area of rectangle </h2>
    <label for="side"> Enter the side length of the square: </label>
    <input type="number" id="side" name="side">
    <button onclick="areaofsquare()"> Calculate Area </button>
    <p id="result"></p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<h2> area of triangle </h2>
<label for="base"> Enter the base length of the triangle: </label>
<input type="number" id="base" name="base">
<label for="height"> Enter the height of the triangle: </label>
<input type="number" id="height" name="height">
<button onclick="areaoftriangle()"> Calculate Area </button>
<p id="triangle-result"></p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<h2> area of circle </h2>
<label for="radius"> Enter the radius of the circle: </label>
<input type="number" id="radius" name="radius">
<button onclick="areaofcircle()"> Calculate Area </button>
<p id="circle-result"></p>
</body>
</html>
